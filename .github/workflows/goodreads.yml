name: Update GoodReads Shelves

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # also runnable manually from the Actions tab

concurrency:
  group: goodreads-shelves
  cancel-in-progress: false

jobs:
  update-goodreads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch shelves and update README
        run: python scripts/update_goodreads.py

      - name: Commit and push if anything changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GoodReads shelves [skip ci]"
          file_pattern: README.md