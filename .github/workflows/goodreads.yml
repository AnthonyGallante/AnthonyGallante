name: Update GoodReads Shelves

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # also runnable manually from the Actions tab

concurrency:
  group: goodreads-shelves
  cancel-in-progress: false   # queue runs instead of cancelling; avoids mid-push cancellation

jobs:
  update-goodreads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch shelves and update README
        run: python scripts/update_goodreads.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes." || {
            git commit -m "chore: refresh GoodReads shelves [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          }