name: Update GoodReads Shelves

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # also runnable manually from the Actions tab

jobs:
  update-goodreads:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to push the README commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch shelves and update README
        run: python scripts/update_goodreads.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git diff --quiet && echo "No changes." || {
            git add README.md
            git commit -m "chore: refresh GoodReads shelves [skip ci]"
            git push
          }